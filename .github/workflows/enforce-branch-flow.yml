name: Enforce Branch Flow & Merge Policy

on:
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read
  pull-requests: write

jobs:
  enforce-branch-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7

      - name: Validate allowed source -> target branch paths
        id: validate
        run: bash ./.github/scripts/check-branch-flow.sh "${{ github.base_ref }}" "${{ github.head_ref }}"

      - name: Comment merge method on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          METHOD: ${{ steps.validate.outputs.method }}
          METHOD_LABEL: ${{ steps.validate.outputs.label }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$VALIDATE_OUTCOME" == "success" ]]; then
            case "$METHOD" in
              merge)  color="blue" ;;
              squash) color="brightgreen" ;;
              *)      color="lightgrey" ;;
            esac
            badge_label="${METHOD_LABEL// /_}"
            badge="![Merge method](https://img.shields.io/badge/Merge_method-${badge_label}-${color}?style=for-the-badge)"
            body=$(printf 'Branch flow check passed: `%s` -> `%s`\n\n%s' "$HEAD_REF" "$BASE_REF" "$badge")
          else
            body=$(printf 'Branch flow check failed: `%s` -> `%s`\n\nSee the job log for the allowed transitions.' "$HEAD_REF" "$BASE_REF")
          fi
          gh pr comment "$PR_NUMBER" --body "$body" --edit-last --create-if-none
